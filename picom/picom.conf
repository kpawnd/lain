backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.55;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-color = "#000000";
shadow-exclude = [ "class_g = 'Rofi'", "_GTK_FRAME_EXTENTS@", "window_type = 'dock'", "window_type = 'desktop'" ];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

inactive-opacity = 0.96;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [ "100:fullscreen", "96:class_g = 'VSCodium'", "100:class_g = 'thorium-browser'", "100:class_g = 'Thorium-browser'" ];

blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@" ];

corner-radius = 0;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

use-damage = true;
unredir-if-possible = true;
